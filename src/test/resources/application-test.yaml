spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: test
    password: test

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        # will be created via liquibase
        default_schema: spring_app_template
        jdbc:
          time_zone: UTC
          lob.non_contextual_creation: true
