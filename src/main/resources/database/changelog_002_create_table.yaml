databaseChangeLog:
  - changeSet:
      id: spring-app-template-2
      author: robin-schneider
      changes:

        - createTable:
            schemaName: spring_app_template
            tableName: contract
            columns:
              - column:
                  name: contract_id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
