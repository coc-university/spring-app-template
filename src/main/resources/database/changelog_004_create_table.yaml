databaseChangeLog:
  - changeSet:
      id: spring-app-template-4
      author: robin-schneider
      changes:

        - createTable:
            schemaName: spring_app_template
            tableName: address
            columns:
              - column:
                  name: address_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: street
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: contract_id
                  type: uuid
