databaseChangeLog:
  - changeSet:
      id: spring-app-template-4
      author: robin-schneider
      changes:

        - createTable:
            schemaName: spring_app_template
            tableName: address
            columns:
              - column:
                  name: address_id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: street
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: contract_contract_id
                  type: bigint

        - addForeignKeyConstraint:
            baseTableName: address
            baseColumnNames: contract_contract_id
            referencedTableName: contract
            referencedColumnNames: contract_id
            constraintName: fk_address_contract
